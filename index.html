<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #252b49;
            color: white;
        }

        /* HEADER */

        header {
            width: 100%;
            padding: 22px 13%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .logo:hover {
            color: #20a9e8;
            transform: scale(1.05);
        }

        nav {
            display: flex;
            gap: 30px;
            margin-left: 50px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        nav a:hover {
            color: #20a9e8;
            transform: translateY(-2px);
        }

        .right {
            display: flex;
            align-items: center;
            gap: 45px;
        }

        .login {
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .login:hover {
            color: #20a9e8;
        }

        .join {
            background: #20a9e8;
            color: white;
            text-decoration: none;
            padding: 20px 30px;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s;
        }

        .join:hover {
            background: #fff;
            color: #20a9e8;
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }

        /* HERO */

        .hero {
            min-height: 750px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 50px 9%;
        }

        .hero-text {
            width: 50%;
        }

        .welcome {
            color: #20a9e8;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 45px;
        }

        .hero h1 {
            font-size: 66px;
            line-height: 1.25;
            margin-bottom: 35px;
        }

        .hero p {
            font-size: 23px;
            line-height: 1.5;
            color: #f2f2f2;
            margin-bottom: 35px;
            max-width: 550px;
        }

        .buttons {
            display: flex;
            gap: 12px;
        }

        .quote,
        .learn {
            padding: 18px 45px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .quote {
            background: #20a9e8;
            color: white;
            border: 2px solid #20a9e8;
        }

        .quote:hover {
            background: white;
            color: #20a9e8;
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .learn {
            background: transparent;
            color: #20a9e8;
            border: 2px solid #20a9e8;
        }

        .learn:hover {
            background: #20a9e8;
            color: white;
            transform: translateY(-5px);
        }

        /* IMAGES */

        .hero-images {
            width: 45%;
            height: 600px;
            position: relative;
        }

        .teacher {
            position: absolute;
            width: 450px;
            height: 540px;
            object-fit: cover;
            right: 20px;
            top: 40px;
            border-radius: 8px;
            transition: 0.5s;
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
        }

        .teacher:hover {
            transform: scale(1.03) translateY(-8px);
        }

        .small-photo {
            position: absolute;
            width: 285px;
            height: 260px;
            object-fit: cover;
            left: 20px;
            bottom: 35px;
            border: 5px solid white;
            border-radius: 10px;
            z-index: 2;
            transition: 0.5s;
        }

        .small-photo:hover {
            transform: scale(1.07) rotate(-2deg);
            box-shadow: 0 15px 30px rgba(0,0,0,0.35);
        }

        /* TURQUOISE SHAPE */

        .shape {
            position: absolute;
            width: 125px;
            height: 145px;
            background: #59bdb5;
            right: -15px;
            top: 10px;
            z-index: 0;
        }

        /* RESPONSIVE */

        @media (max-width: 1000px) {

            header {
                padding: 20px 5%;
            }

            nav {
                gap: 15px;
                margin-left: 20px;
            }

            .hero {
                padding: 50px 5%;
            }

            .hero h1 {
                font-size: 50px;
            }

            .teacher {
                width: 350px;
                height: 450px;
            }

            .small-photo {
                width: 220px;
                height: 210px;
            }
        }

        @media (max-width: 750px) {

            header {
                flex-wrap: wrap;
                gap: 20px;
            }

            nav {
                order: 3;
                width: 100%;
                justify-content: center;
            }

            .hero {
                flex-direction: column;
                text-align: center;
            }

            .hero-text {
                width: 100%;
            }

            .hero h1 {
                font-size: 42px;
            }

            .hero p {
                margin-left: auto;
                margin-right: auto;
            }

            .buttons {
                justify-content: center;
            }

            .hero-images {
                width: 100%;
                margin-top: 50px;
            }
        }

        @media (max-width: 500px) {

            .right {
                gap: 15px;
            }

            .join {
                padding: 14px 18px;
            }

            .logo {
                font-size: 22px;
            }

            nav {
                gap: 12px;
                font-size: 14px;
            }

            .hero h1 {
                font-size: 35px;
            }

            .hero p {
                font-size: 17px;
            }

            .teacher {
                width: 280px;
                height: 380px;
                right: 0;
            }

            .small-photo {
                width: 180px;
                height: 170px;
                left: 0;
            }
        }
    </style>
</head>

<body>

    <header>

        <div class="logo">
            BrandName
        </div>

        <nav>
            <a href="#">Home</a>
            <a href="#">Product</a>
            <a href="#">Pricing</a>
            <a href="#">Contact</a>
        </nav>

        <div class="right">
            <a href="#" class="login">Login</a>

            <a href="#" class="join">
                JOIN US →
            </a>
        </div>

    </header>


    <section class="hero">

        <div class="hero-text">

            <div class="welcome">
                Welcome
            </div>

            <h1>
                Best Learning<br>
                Opportunities
            </h1>

            <p>
                We know how large objects will act,
                but things on a small scale
            </p>

            <div class="buttons">

                <button class="quote">
                    Get Quote Now
                </button>

                <button class="learn">
                    Learn More
                </button>

            </div>

        </div>


        <div class="hero-images">

            <div class="shape"></div>

            <!-- Katta rasm -->
            <img
                class="teacher"
                src="https://images.unsplash.com/photo-1544717305-2782549b5136?auto=format&fit=crop&w=800&q=80"
            >

            <!-- Kichik rasm -->
            <img
                class="small-photo"
                src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80"
            >

        </div>

    </section>

</body>
</html>
